apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-servicemonitor
  labels:
    release: prometheus
    namespace: monitoring 
spec:
  selector:
    matchLabels:
      app: gateway
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
